name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax
        run: node --check prototype/app.js && node --check tests/static-smoke.cjs
      - name: Verify static navigation and local assets
        run: node tests/static-smoke.cjs
      - name: Check deployment manifests
        run: |
          test -f Dockerfile
          test -f compose.yml
          test -f prototype/index.html
