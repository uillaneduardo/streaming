name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax (official UI)
        run: node --check apps/web/app.js
      - name: Offline artwork and navigation contract
        run: node tests/official-ui-smoke.cjs
      - name: Build manifest checks
        run: |
          test -f compose.yml
          test -f apps/web/Dockerfile
          test -f apps/api/Dockerfile
          test -f apps/api/sql/001_initial.sql
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test release policy
        run: npm test
      - name: Compile API
        run: npm run build
  integration:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-temporary-password-not-for-production
      DB_ROOT_PASSWORD: ci-temporary-root-password
      WEB_PORT: 8088
    steps:
      - uses: actions/checkout@v4
      - name: Check compose configuration
        run: docker compose config --quiet
      - name: Build and start web, api and MariaDB
        run: docker compose up -d --build
      - name: Wait for public API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8088/api/v1/health; then exit 0; fi
            sleep 2
          done
          echo 'API did not become healthy'
          exit 1
      - name: Verify running frontend version and freshness
        run: |
          node -e 'Promise.all([fetch("http://localhost:8088/version.json"),fetch("http://localhost:8088/")]).then(async ([versionResponse,htmlResponse])=>{if(!versionResponse.ok||!htmlResponse.ok)throw Error("web unavailable");const version=await versionResponse.json();const html=await htmlResponse.text();if(!/^[0-9a-f]{12}$/.test(version.version))throw Error("missing fingerprint");if(!html.includes("app.js?v="+version.version)||!html.includes("styles.css?v="+version.version))throw Error("stale HTML assets");if(!String(htmlResponse.headers.get("cache-control")).includes("no-store"))throw Error("index is cacheable");if(!String(versionResponse.headers.get("cache-control")).includes("no-store"))throw Error("version manifest is cacheable");console.log("Frontend version: "+version.version)}).catch(e=>{console.error(e);process.exit(1)})'
      - name: Verify production migration starts with an EMPTY catalogue
        run: |
          node -e "fetch('http://localhost:8088/api/v1/public/bootstrap').then(r=>r.json()).then(d=>{if(d.series.length||d.seasons.length||d.episodes.length||d.banners.length||d.homeSections.length)throw Error('production migrations must not auto-seed catalogue');console.log('Empty catalogue verified')}).catch(e=>{console.error(e);process.exit(1)})"
      - name: Load explicit DEMO fixture ONLY in CI
        run: |
          docker compose exec -T db sh -c 'MYSQL_PWD="$MARIADB_PASSWORD" mariadb -u "$MARIADB_USER" "$MARIADB_DATABASE"' < tests/fixtures/demo-catalog.sql
      - name: Verify public catalogue and embargo
        run: |
          node -e "fetch('http://localhost:8088/api/v1/public/bootstrap').then(r=>r.json()).then(d=>{if(d.series.length!==5||d.episodes.length!==10)throw Error('unexpected fixture count');const x=d.episodes.find(e=>e.id==='e3');if(!x||x.availability!=='upcoming'||x.youtube)throw Error('embargo leak')}).catch(e=>{console.error(e);process.exit(1)})"
      - name: Verify Studio authentication and scoped edits
        run: |
          export CI_LOGIN_EMAIL="ci-owner@example.test"
          export CI_LOGIN_PASSWORD="$(openssl rand -hex 24)"
          export BOOTSTRAP_EMAIL="$CI_LOGIN_EMAIL"
          export BOOTSTRAP_NAME="CI Owner"
          export BOOTSTRAP_PASSWORD="$CI_LOGIN_PASSWORD"
          docker compose exec -T -e BOOTSTRAP_EMAIL -e BOOTSTRAP_NAME -e BOOTSTRAP_PASSWORD api node dist/bootstrap.js
          node tests/auth-integration.cjs
          unset BOOTSTRAP_EMAIL BOOTSTRAP_NAME BOOTSTRAP_PASSWORD CI_LOGIN_PASSWORD
      - name: Verify deleted or edited demo content NEVER reappears after migration
        run: |
          # Simulate an existing legacy installation: original catalogue exists,
          # but the migration journal did not exist in older releases.
          docker compose exec -T db sh -c 'MYSQL_PWD="$MARIADB_PASSWORD" mariadb -u "$MARIADB_USER" "$MARIADB_DATABASE"' <<'SQL'
          DELETE FROM banners WHERE target_series_id='s3';
          DELETE FROM episodes WHERE season_id IN (SELECT id FROM seasons WHERE series_id IN ('s3','s5'));
          DELETE FROM seasons WHERE series_id IN ('s3','s5');
          DELETE FROM series_teams WHERE series_id IN ('s3','s5');
          DELETE FROM series WHERE id IN ('s3','s5');
          DELETE FROM teams WHERE id='t3';
          DELETE FROM home_sections WHERE id='hs4';
          UPDATE series SET title='Título editado preservado' WHERE id='s1';
          DROP TABLE schema_migrations;
          SQL
          docker compose run --rm migrate
          # Repeated deploy must also be a no-op.
          docker compose run --rm migrate
          node -e "fetch('http://localhost:8088/api/v1/public/bootstrap',{cache:'no-store'}).then(r=>r.json()).then(d=>{for(const id of ['s3','s5'])if(d.series.some(s=>s.id===id))throw Error('deleted series reappeared: '+id);if(d.series.find(s=>s.id==='s1')?.title!=='Título editado preservado')throw Error('edited content changed');if(d.homeSections.some(s=>s.id==='hs4'))throw Error('deleted home section reappeared');console.log('Deleted and edited content preserved across legacy upgrade and repeated migration')}).catch(e=>{console.error(e);process.exit(1)})"
          result="$(docker compose exec -T db sh -c 'MYSQL_PWD="$MARIADB_PASSWORD" mariadb -N -u "$MARIADB_USER" "$MARIADB_DATABASE" -e "SELECT COUNT(*) FROM teams WHERE id=0x7433"' | tr -d '\r')"
          test "$result" = "0"
          baseline="$(docker compose exec -T db sh -c 'MYSQL_PWD="$MARIADB_PASSWORD" mariadb -N -u "$MARIADB_USER" "$MARIADB_DATABASE" -e "SELECT legacy_baseline FROM schema_migrations WHERE name=0x3030315f696e697469616c2e73716c"' | tr -d '\r')"
          test "$baseline" = "1"
          echo "Legacy migration baseline verified; deleted team did not return."
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=120
      - name: Stop test containers
        if: always()
        run: docker compose down -v
