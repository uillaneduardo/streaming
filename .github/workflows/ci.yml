name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project files
        run: |
          test -f prototype/index.html
          test -f compose.yml
          test -f Dockerfile
      - name: Validate JavaScript syntax
        run: |
          node --check prototype/app.js
      - name: Verify local assets
        run: |
          test -f prototype/assets/cover-orbita.svg
          test -f prototype/assets/cover-mares.svg
      - name: Basic HTML smoke check
        run: |
          grep -q 'id="app"' prototype/index.html
