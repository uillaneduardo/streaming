name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax (official UI)
        run: node --check apps/web/app.js
      - name: Offline artwork and navigation contract
        run: node tests/official-ui-smoke.cjs
      - name: Build manifest checks
        run: |
          test -f compose.yml
          test -f apps/web/Dockerfile
          test -f apps/api/Dockerfile
          test -f apps/api/sql/001_initial.sql
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test release policy
        run: npm test
      - name: Compile API
        run: npm run build
  integration:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-temporary-password-not-for-production
      DB_ROOT_PASSWORD: ci-temporary-root-password
      WEB_PORT: 8088
    steps:
      - uses: actions/checkout@v4
      - name: Check compose configuration
        run: docker compose config --quiet
      - name: Build and start web, api and MariaDB
        run: docker compose up -d --build
      - name: Wait for public API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8088/api/v1/health; then exit 0; fi
            sleep 2
          done
          echo 'API did not become healthy'
          exit 1
      - name: Verify running frontend version and freshness
        run: |
          node -e 'Promise.all([fetch("http://localhost:8088/version.json"),fetch("http://localhost:8088/")]).then(async ([versionResponse,htmlResponse])=>{if(!versionResponse.ok||!htmlResponse.ok)throw Error("web unavailable");const version=await versionResponse.json();const html=await htmlResponse.text();if(!/^[0-9a-f]{12}$/.test(version.version))throw Error("missing fingerprint");if(!html.includes("app.js?v="+version.version)||!html.includes("styles.css?v="+version.version))throw Error("stale HTML assets");if(!String(htmlResponse.headers.get("cache-control")).includes("no-store"))throw Error("index is cacheable");if(!String(versionResponse.headers.get("cache-control")).includes("no-store"))throw Error("version manifest is cacheable");console.log("Frontend version: "+version.version)}).catch(e=>{console.error(e);process.exit(1)})'
      - name: Verify public catalogue and embargo
        run: |
          node -e "fetch('http://localhost:8088/api/v1/public/bootstrap').then(r=>r.json()).then(d=>{if(d.series.length!==5||d.episodes.length!==10)throw Error('unexpected fixture count');const x=d.episodes.find(e=>e.id==='e3');if(!x||x.availability!=='upcoming'||x.youtube)throw Error('embargo leak')}).catch(e=>{console.error(e);process.exit(1)})"
      - name: Verify Studio authentication and scoped edits
        run: |
          export CI_LOGIN_EMAIL="ci-owner@example.test"
          export CI_LOGIN_PASSWORD="$(openssl rand -hex 24)"
          export BOOTSTRAP_EMAIL="$CI_LOGIN_EMAIL"
          export BOOTSTRAP_NAME="CI Owner"
          export BOOTSTRAP_PASSWORD="$CI_LOGIN_PASSWORD"
          docker compose exec -T -e BOOTSTRAP_EMAIL -e BOOTSTRAP_NAME -e BOOTSTRAP_PASSWORD api node dist/bootstrap.js
          node tests/auth-integration.cjs
          unset BOOTSTRAP_EMAIL BOOTSTRAP_NAME BOOTSTRAP_PASSWORD CI_LOGIN_PASSWORD
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=120
      - name: Stop test containers
        if: always()
        run: docker compose down -v
