services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-cenalivre}
      DB_NAME: ${DB_NAME:-cenalivre}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: mariadb:11.4
    environment:
      MYSQL_PWD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_USER: ${DB_USER:-cenalivre}
      DB_NAME: ${DB_NAME:-cenalivre}
    volumes:
      - ./apps/api/sql/:/migrations/:ro
    entrypoint: ["/bin/sh","-ec"]
    command:
      - 'for sql in /migrations/*.sql; do mariadb -h db -u "$$DB_USER" "$$DB_NAME" < "$$sql"; done'
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-cenalivre}
      MARIADB_USER: ${DB_USER:-cenalivre}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - cenalivre_db:/var/lib/mysql
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  cenalivre_db:
